title = "ServerDesk secret scanning"

[extend]
useDefault = true

[[allowlists]]
description = "Exact dynamic PEM wrapper for a randomly generated test key, not key material"
targetRules = ["private-key"]
condition = "AND"
paths = ['''^tests/ServerDesk.Tests/BitwardenSshKeyTests\.cs$''']
regexTarget = "line"
regexes = ['''^\s*try \{ return "-----BEGIN OPENSSH PRIVATE KEY-----\\n"\+Convert\.ToBase64String\(bytes,Base64FormattingOptions\.InsertLineBreaks\)\+"\\n-----END OPENSSH PRIVATE KEY-----\\n"; \}\s*$''']

[[allowlists]]
description = "Exact prose protocol list in an acceptance report, not a credential"
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['''^docs/reports/ergonomics-2026-10-17\.md$''']
regexTarget = "match"
regexes = ['''^password URLs, SSH/RDP/VNC/Serial $''']

[[allowlists]]
description = "Public disposable Net-SNMP fixture password; not a user credential"
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['''^tools/ServerDesk.UiSmoke/NetworkSnmpChecks\.cs$''']
regexTarget = "match"
regexes = ['''PrivacyPassword:"fixture-priv-2026"''']

[[allowlists]]
description = "Exact UI constructor expression misclassified as an API key"
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['''^src/ServerDesk.App/ProfileEditorDialog\.cs$''']
regexTarget = "line"
regexes = ['''^\s*var vncAuth=new ComboBox \{ Name="VncAuthentication",ItemsSource=new\[\]\{L.T\("Hasło VNC"\),L.T\("Bez uwierzytelniania"\)\},SelectedIndex=\(int\)original.Vnc.Authentication,HorizontalAlignment=HorizontalAlignment.Stretch \};\s*$''']

[[allowlists]]
description = "Exact unit-test coverage prose in the 0.49.0 report, not a credential"
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['''^docs/reports/release-verification-0\.49\.0\.md$''']
regexTarget = "match"
regexes = ['''^credentials, missing/corrupt $''']
